apiVersion: v1
kind: Secret
metadata:
  name: infonow-secrets
  namespace: infonow
type: Opaque
stringData:
  # PostgreSQL
  DATABASE_URL: "postgresql://USER:PASSWORD@postgres-rw.postgres.svc.cluster.local:5432/info_now_db?sslmode=require"
  DIRECT_DATABASE_URL: "postgresql://USER:PASSWORD@postgres-rw.postgres.svc.cluster.local:5432/info_now_db?schema=public&sslmode=require"
  POOLED_DATABASE_URL: "postgresql://USER:PASSWORD@pgbouncer-rw.postgres.svc.cluster.local:5432/info_now_db?schema=public&pgbouncer=true&sslmode=require"

  # Auth
  GOOGLE_CLIENT_ID: "replace-me"
  ACCESS_TOKEN_SECRET: "replace-me"
  REFRESH_TOKEN_SECRET: "replace-me"

  # News/YT APIs
  NEWSAPI_KEY_1: "replace-me"
  NEWSAPI_KEY_2: "replace-me"
  NEWSAPI_KEY_3: "replace-me"
  YOUTUBE_API_KEY: "replace-me"

  # External model endpoint (if required)
  OLLAMA_URL: "http://ollama.inference.svc.cluster.local:11434"
